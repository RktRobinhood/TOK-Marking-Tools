<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Focused tools for planning and assessing Theory of Knowledge work.">
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <title>TOK Tools</title>
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --ink: #1c1e22;
      --muted: #5f656e;
      --line: #e4e1db;
      --line-strong: #cfcbc3;
      --accent: #15645a;
      --accent-soft: #eef4f2;
      --focus: #15645a;
      --shadow: 0 1px 2px rgba(28, 30, 34, .05);
      --shadow-lift: 0 6px 20px rgba(28, 30, 34, .09);
      --measure: 62rem;
      --serif: "Iowan Old Style", Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --surface: #1d2026;
        --ink: #e8e9ec;
        --muted: #a2a8b2;
        --line: #2c3037;
        --line-strong: #3d434c;
        --accent: #6ec3ae;
        --accent-soft: #1e2a29;
        --focus: #6ec3ae;
        --shadow: none;
        --shadow-lift: 0 6px 20px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute; top: .75rem; left: .75rem; z-index: 10;
      padding: .6rem .9rem; border-radius: .4rem;
      background: var(--accent); color: var(--bg); text-decoration: none;
      transform: translateY(-250%);
    }
    .skip-link:focus { transform: translateY(0); }

    .wrap { width: min(100% - 2.5rem, var(--measure)); margin-inline: auto; }

    .site-header {
      display: flex; flex-wrap: wrap; gap: .75rem;
      align-items: baseline; justify-content: space-between;
      padding-block: 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      margin: 0; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em;
    }
    .site-header__meta { color: var(--muted); font-size: .85rem; }

    .intro { padding-block: clamp(2.75rem, 7vw, 4.5rem) clamp(2rem, 5vw, 3rem); }
    .intro h1 {
      max-width: 22ch; margin: 0 0 1rem;
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(2rem, 4.5vw, 2.9rem); line-height: 1.15; letter-spacing: -.02em;
    }
    .intro p { max-width: 56ch; margin: 0; color: var(--muted); font-size: 1.05rem; }

    .group { padding-bottom: clamp(2.25rem, 5vw, 3.25rem); }
    .group__heading {
      margin: 0 0 1rem; padding-bottom: .6rem;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .78rem; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
    }

    .tool-grid {
      display: grid; gap: 1rem; margin: 0; padding: 0; list-style: none;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr));
    }
    .tool { display: flex; }
    .tool__link {
      display: flex; flex: 1; flex-direction: column; gap: .55rem;
      padding: 1.35rem;
      border: 1px solid var(--line); border-radius: .7rem;
      background: var(--surface); box-shadow: var(--shadow);
      color: inherit; text-decoration: none;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .tool__link:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-lift);
      transform: translateY(-2px);
    }
    .tool__link:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }

    .tool__icon {
      display: grid; place-items: center;
      width: 2.25rem; aspect-ratio: 1; border-radius: .5rem;
      color: var(--accent); background: var(--accent-soft);
    }
    .tool__icon svg {
      width: 1.2rem; fill: none; stroke: currentColor;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .tool__title {
      margin: .35rem 0 0;
      font-family: var(--serif); font-weight: 600; font-size: 1.15rem;
      line-height: 1.25; letter-spacing: -.01em;
    }
    .tool__description { margin: 0; color: var(--muted); font-size: .92rem; }

    .tool__action {
      display: inline-flex; align-items: center; gap: .4rem;
      margin-top: auto; padding-top: .9rem;
      color: var(--accent); font-size: .85rem; font-weight: 600;
    }
    .tool__arrow { transition: transform .18s ease; }
    .tool__link:hover .tool__arrow { transform: translateX(3px); }

    .site-footer {
      display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; justify-content: space-between;
      padding-block: 1.25rem 2.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted); font-size: .82rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      .tool__link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#tools">Skip to tools</a>

  <header class="site-header wrap">
    <p class="wordmark">TOK Tools</p>
    <p class="site-header__meta">Ikast-Brande Gymnasium</p>
  </header>

  <main class="wrap" id="tools">
    <div class="intro">
      <h1>Tools for planning and assessing Theory of Knowledge work.</h1>
      <p>{{TOOL_COUNT}} tools, free to use and open in this tab. Nothing is uploaded &mdash; your work stays in your browser.</p>
    </div>

{{TOOL_SECTIONS}}
  </main>

  <footer class="site-footer wrap">
    <span>Built for classroom use.</span>
    <span>Works offline once loaded.</span>
  </footer>
</body>
</html>
